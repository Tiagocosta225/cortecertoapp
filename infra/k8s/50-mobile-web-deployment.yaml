apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortecertoapp-mobile-web
  namespace: cortecerto
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cortecertoapp-mobile-web
  template:
    metadata:
      labels:
        app: cortecertoapp-mobile-web
    spec:
      containers:
        - name: mobile-web
          image: ghcr.io/your-org/cortecertoapp-mobile-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
