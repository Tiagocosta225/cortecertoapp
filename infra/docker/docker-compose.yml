services:
  postgres:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/cortecerto-postgres:${IMAGE_TAG:-main-latest}
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: cortecerto_postgres
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-projeto_db}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
      - ./postgres/backup:/backup
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-projeto_db}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/cortecerto-backend:${IMAGE_TAG:-main-latest}
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    expose:
      - "3000"
      - "5555"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-projeto_db}
    env_file:
      - ./.env
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/cortecerto-frontend:${IMAGE_TAG:-main-latest}
    build:
      context: ../../apps/public-web
      dockerfile: Dockerfile
    expose:
      - "80"
    networks:
      - app-network
    restart: unless-stopped

  admin-panel:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/cortecerto-admin-panel:${IMAGE_TAG:-main-latest}
    build:
      context: ../../apps/admin-panel
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://backend:3000
      - ADMIN_API_KEY=${ADMIN_API_KEY}
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3

  landing:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/cortecerto-landing:${IMAGE_TAG:-main-latest}
    build:
      context: ../../apps/landing
      dockerfile: Dockerfile
    expose:
      - "80"
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-local}/cortecerto-nginx:${IMAGE_TAG:-main-latest}
    build:
      context: ../nginx
      dockerfile: Dockerfile
    environment:
      - FRONTEND_HOST=${FRONTEND_HOST:-frontend.local}
      - ADMIN_HOST=${ADMIN_HOST:-admin.local}
      - LANDING_HOST=${LANDING_HOST:-landing.local}
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      admin-panel:
        condition: service_healthy
      landing:
        condition: service_started
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  postgres_logs:
    driver: local
